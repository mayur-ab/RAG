<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Assistant</title>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #22c55e;
      --warning: #f59e0b;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.15), transparent),
                      linear-gradient(180deg, #0b0f17 0%, #0d1220 100%);
      --surface: #141b2d;
      --surface-elevated: #1a2236;
      --surface-hover: #212b42;
      --border: #2a3548;
      --text: #eef2ff;
      --text-muted: #94a3b8;
      --user-bubble: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
      --user-border: #4338ca;
      --assistant-bubble: #141b2d;
      --system-bg: #14532d33;
      --system-border: #166534;
      --system-text: #86efac;
      --input-bg: #0f1524;
      --header-bg: rgba(20, 27, 45, 0.85);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.08), transparent),
                      linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --user-bubble: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --user-border: #6366f1;
      --assistant-bubble: #ffffff;
      --system-bg: #ecfdf5;
      --system-border: #86efac;
      --system-text: #166534;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.9);
      --error-bg: #fef2f2;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    header h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em; }
    header p { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }

    .header-actions { display: flex; align-items: center; gap: 0.5rem; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

    .status {
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
      white-space: nowrap;
    }

    .status.ok { color: var(--success); border-color: #16653455; }

    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.28rem 0.55rem 0.28rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.72rem;
      color: var(--text-muted);
      user-select: none;
      white-space: nowrap;
    }

    .mode-toggle-label {
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .mode-toggle-label.active {
      color: var(--accent);
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .switch-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform var(--transition), background var(--transition);
    }

    .switch input:checked + .switch-slider {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent);
    }

    .switch input:checked + .switch-slider::before {
      transform: translate(18px, -50%);
      background: var(--accent);
    }

    .switch input:focus-visible + .switch-slider {
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .meta-mode {
      margin-top: 0.35rem;
      font-size: 0.68rem;
      color: var(--accent);
      font-weight: 600;
    }

    main {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #chat::-webkit-scrollbar {
      width: 10px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    #chat::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
      background-clip: padding-box;
    }

    .chat-inner {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: min(100%, 280px);
    }

    .composer {
      flex-shrink: 0;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      max-width: 85%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      max-width: 95%;
    }

    [data-theme="dark"] .message.error {
      background: #3f1d1d;
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .message.system {
      align-self: center;
      background: var(--system-bg);
      border: 1px solid var(--system-border);
      color: var(--system-text);
      font-size: 0.84rem;
      max-width: 95%;
    }

    .match-label {
      margin-top: 0.6rem;
      font-size: 0.76rem;
      color: var(--success);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
    }

    .match-label.low { color: var(--warning); background: rgba(245, 158, 11, 0.1); }
    .match-label.weak { color: var(--text-muted); background: var(--surface-hover); }

    .meta {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .welcome {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 1rem 1.5rem;
    }

    .welcome h2 {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .welcome p { font-size: 0.9rem; max-width: 420px; margin: 0 auto; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .suggestion:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.45rem;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      box-shadow: var(--shadow);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow);
    }

    .attach-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: all var(--transition);
      display: grid;
      place-items: center;
    }

    .attach-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      transform: scale(1.04);
    }

    .attach-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #file-input { display: none; }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      padding: 0.65rem 0.25rem;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.93rem;
      outline: none;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .typing {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding: 0.35rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .upload-toast {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1rem;
    }

    .upload-toast.success { color: var(--success); }
    .upload-toast.error { color: var(--error-text); }

    .input-meta {
      display: flex;
      justify-content: flex-end;
      padding: 0.15rem 0.35rem 0;
      min-height: 1.1rem;
    }

    .query-limit-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .query-limit-hint.warn { color: var(--warning); }
    .query-limit-hint.over { color: var(--error-text); }

    .citations { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
    .citations summary { cursor: pointer; color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .toolbar-btn, .model-select {
      font-size: 0.72rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .toolbar-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
    .model-select { max-width: 160px; }

    .export-wrap { position: relative; }
    .export-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 140px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 20;
      overflow: hidden;
    }

    .export-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.75rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .export-menu button:hover { background: var(--surface-hover); }

    .badge {
      margin-top: 0.45rem;
      display: inline-flex;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
    }

    .badge-success { color: var(--success); background: rgba(34, 197, 94, 0.12); }
    .badge-warning { color: var(--warning); background: rgba(245, 158, 11, 0.12); }
    .badge-cache { color: var(--accent); background: rgba(99, 102, 241, 0.12); }

    .message-actions { margin-top: 0.35rem; display: flex; gap: 0.35rem; }
    .message-edit-input {
      width: 100%;
      min-height: 2.5rem;
      margin-top: 0.15rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.2);
      color: inherit;
      font: inherit;
      line-height: 1.45;
      resize: vertical;
    }
    .message-edit-actions {
      margin-top: 0.45rem;
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
    }
    .message-edit-actions .edit-save {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .msg-action-btn {
      font-size: 0.68rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.15);
      color: #fff;
      cursor: pointer;
    }

    .table-wrap { overflow-x: auto; margin-top: 0.35rem; }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .table-wrap th, .table-wrap td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.55rem;
      text-align: left;
    }

    .table-wrap th { background: var(--surface-hover); }

    .stop-btn {
      background: #ef4444 !important;
    }

    .drop-zone {
      border: 1px dashed transparent;
      border-radius: calc(var(--radius) + 4px);
      transition: border-color var(--transition), background var(--transition);
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
    }

    .panel, .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .panel[hidden], .modal[hidden] {
      display: none !important;
    }

    .export-menu[hidden] {
      display: none !important;
    }

    .panel-card, .modal-card {
      width: min(720px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .panel-header, .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .doc-row {
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }

    .doc-title { font-weight: 600; font-size: 0.88rem; }
    .doc-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }
    .doc-path { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; word-break: break-all; }

    .progress-track {
      height: 8px;
      background: var(--surface-hover);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.75rem 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      transition: width 0.25s ease;
    }

    .streaming-body::after {
      content: "▍";
      animation: blink 1s step-end infinite;
      color: var(--accent);
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 768px) {
      header { padding: 0.65rem 0.85rem; flex-wrap: wrap; }
      header p { display: none; }
      .header-actions { flex-wrap: wrap; justify-content: flex-end; }
      .toolbar { padding: 0.4rem 0.75rem; }
      .mode-toggle { order: 3; width: 100%; justify-content: center; }
      .model-select { max-width: 120px; }
      .chat-inner, .composer { padding-left: 0.75rem; padding-right: 0.75rem; }
      .message { max-width: 92%; font-size: 0.88rem; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">RAG</div>
      <div>
        <h1>Knowledge Assistant</h1>
        <p>Ask anything from your document library</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="mode-toggle" title="Toggle between document search (RAG) and direct model chat">
        <span class="mode-toggle-label active" id="rag-label">RAG</span>
        <label class="switch" aria-label="Toggle RAG mode">
          <input type="checkbox" id="rag-toggle" checked />
          <span class="switch-slider"></span>
        </label>
        <span class="mode-toggle-label" id="direct-label">Direct</span>
      </div>
      <select id="model-select" class="model-select" title="LLM model"></select>
      <button type="button" class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <span id="theme-icon">☀️</span>
      </button>
      <div class="status" id="status">Connecting...</div>
    </div>
  </header>

  <div class="toolbar">
    <button type="button" class="toolbar-btn" id="new-chat-btn">New chat</button>
    <div class="export-wrap">
      <button type="button" class="toolbar-btn" id="export-btn">Export</button>
      <div class="export-menu" id="export-menu" hidden>
        <button type="button" id="export-md">Markdown</button>
        <button type="button" id="export-pdf">PDF</button>
        <button type="button" id="export-copy">Copy all</button>
      </div>
    </div>
    <button type="button" class="toolbar-btn" id="docs-btn">Documents</button>
    <button type="button" class="toolbar-btn" id="reindex-btn">Re-index all</button>
  </div>

  <main>
    <div id="chat">
      <div class="chat-inner" id="chat-inner">
        <div class="welcome" id="welcome">
          <h2>What would you like to know?</h2>
          <p>Upload documents with the + button or ask questions about your indexed knowledge base.</p>
          <div class="suggestions">
            <button class="suggestion" type="button">What is the Duolingo Strategy?</button>
            <button class="suggestion" type="button">Tell me about the Comic Strip Style Memes</button>
            <button class="suggestion" type="button">Explain The Role of Namagiri Devi</button>
          </div>
        </div>
      </div>
    </div>

    <template id="welcome-template">
      <div class="welcome" id="welcome">
        <h2>What would you like to know?</h2>
        <p>Upload documents with the + button or ask questions about your indexed knowledge base.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">What is the Duolingo Strategy?</button>
          <button class="suggestion" type="button">Tell me about the Comic Strip Style Memes</button>
          <button class="suggestion" type="button">Explain The Role of Namagiri Devi</button>
        </div>
      </div>
    </template>

    <div class="composer">
      <div class="upload-toast" id="upload-toast"></div>

      <form id="query-form">
        <div class="drop-zone" id="drop-zone">
          <div class="input-bar">
            <input type="file" id="file-input" multiple
              accept=".txt,.md,.pdf,.doc,.docx,.html,.htm,.csv,.xlsx,.xls" />
            <button type="button" class="attach-btn" id="attach-btn" title="Upload documents" aria-label="Upload documents">+</button>
            <textarea id="query-input" placeholder="Ask a question..." rows="1" required></textarea>
            <button type="submit" class="send-btn" id="submit-btn" title="Send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
              </svg>
            </button>
            <button type="button" class="send-btn stop-btn" id="stop-btn" title="Stop" aria-label="Stop" hidden>■</button>
          </div>
          <div class="input-meta">
            <span id="query-limit-hint" class="query-limit-hint" aria-live="polite"></span>
          </div>
        </div>
      </form>
    </div>
  </main>

  <div class="panel" id="docs-panel" hidden>
    <div class="panel-card">
      <div class="panel-header">
        <h3>Indexed documents</h3>
        <button type="button" class="toolbar-btn" id="docs-close">Close</button>
      </div>
      <div id="docs-list"></div>
    </div>
  </div>

  <div class="modal" id="ingest-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3>Bulk ingest progress</h3>
        <button type="button" class="toolbar-btn" id="ingest-close">Close</button>
      </div>
      <div class="progress-track"><div class="progress-bar" id="ingest-bar"></div></div>
      <div id="ingest-status">Preparing...</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
