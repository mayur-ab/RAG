<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Assistant</title>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #22c55e;
      --warning: #f59e0b;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.15), transparent),
                      linear-gradient(180deg, #0b0f17 0%, #0d1220 100%);
      --surface: #141b2d;
      --surface-elevated: #1a2236;
      --surface-hover: #212b42;
      --border: #2a3548;
      --text: #eef2ff;
      --text-muted: #94a3b8;
      --user-bubble: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
      --user-border: #4338ca;
      --assistant-bubble: #141b2d;
      --system-bg: #14532d33;
      --system-border: #166534;
      --system-text: #86efac;
      --input-bg: #0f1524;
      --header-bg: rgba(20, 27, 45, 0.85);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.08), transparent),
                      linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --user-bubble: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --user-border: #6366f1;
      --assistant-bubble: #ffffff;
      --system-bg: #ecfdf5;
      --system-border: #86efac;
      --system-text: #166534;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.9);
      --error-bg: #fef2f2;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    header h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em; }
    header p { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }

    .header-actions { display: flex; align-items: center; gap: 0.5rem; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

    .status {
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
      white-space: nowrap;
    }

    .status.ok { color: var(--success); border-color: #16653455; }

    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 0.25rem 0 0.5rem;
      min-height: 280px;
      max-height: calc(100vh - 180px);
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      max-width: 95%;
    }

    [data-theme="dark"] .message.error {
      background: #3f1d1d;
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .message.system {
      align-self: center;
      background: var(--system-bg);
      border: 1px solid var(--system-border);
      color: var(--system-text);
      font-size: 0.84rem;
      max-width: 95%;
    }

    .match-label {
      margin-top: 0.6rem;
      font-size: 0.76rem;
      color: var(--success);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
    }

    .match-label.low { color: var(--warning); background: rgba(245, 158, 11, 0.1); }
    .match-label.weak { color: var(--text-muted); background: var(--surface-hover); }

    .meta {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .welcome {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 1rem 1.5rem;
    }

    .welcome h2 {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .welcome p { font-size: 0.9rem; max-width: 420px; margin: 0 auto; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .suggestion:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.45rem;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      box-shadow: var(--shadow);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow);
    }

    .attach-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: all var(--transition);
      display: grid;
      place-items: center;
    }

    .attach-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      transform: scale(1.04);
    }

    .attach-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #file-input { display: none; }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      padding: 0.65rem 0.25rem;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.93rem;
      outline: none;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .typing {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding: 0.35rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .upload-toast {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1rem;
    }

    .upload-toast.success { color: var(--success); }
    .upload-toast.error { color: var(--error-text); }

    /* Sources/citations — kept for when feature is re-enabled */
    .citations { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
    .citations summary { cursor: pointer; color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">RAG</div>
      <div>
        <h1>Knowledge Assistant</h1>
        <p>Ask anything from your document library</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
        <span id="theme-icon">☀️</span>
      </button>
      <div class="status" id="status">Connecting...</div>
    </div>
  </header>

  <main>
    <div id="chat">
      <div class="welcome" id="welcome">
        <h2>What would you like to know?</h2>
        <p>Upload documents with the + button or ask questions about your indexed knowledge base.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">What are the four mental muscles in the Rishi Cognitive Framework?</button>
          <button class="suggestion" type="button">How did Rishi Kanada deduce atomic theory?</button>
          <button class="suggestion" type="button">What is Shabda Brahma?</button>
        </div>
      </div>
    </div>

    <div class="upload-toast" id="upload-toast"></div>

    <form id="query-form">
      <div class="input-bar">
        <input type="file" id="file-input"
          accept=".txt,.md,.pdf,.doc,.docx,.html,.htm,.csv,.xlsx,.xls" />
        <button type="button" class="attach-btn" id="attach-btn" title="Upload document" aria-label="Upload document">+</button>
        <textarea id="query-input" placeholder="Ask a question..." rows="1" required></textarea>
        <button type="submit" class="send-btn" id="submit-btn" title="Send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
      </div>
    </form>
  </main>

  <script>
    const API_BASE = window.location.origin;
    const chat = document.getElementById("chat");
    const form = document.getElementById("query-form");
    const input = document.getElementById("query-input");
    const submitBtn = document.getElementById("submit-btn");
    const attachBtn = document.getElementById("attach-btn");
    const statusEl = document.getElementById("status");
    const welcome = document.getElementById("welcome");
    const fileInput = document.getElementById("file-input");
    const uploadToast = document.getElementById("upload-toast");
    const themeToggle = document.getElementById("theme-toggle");
    const themeIcon = document.getElementById("theme-icon");
    const html = document.documentElement;

    function applyTheme(theme) {
      html.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
      localStorage.setItem("rag-theme", theme);
    }

    const savedTheme = localStorage.getItem("rag-theme") ||
      (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      applyTheme(html.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        statusEl.textContent = `${data.providers.llm} · ${data.providers.vector_store}`;
        statusEl.classList.add("ok");
      } catch {
        statusEl.textContent = "Offline";
      }
    }

    function addMessage(text, role, extras = {}) {
      welcome?.remove();
      const div = document.createElement("div");
      div.className = `message ${role}`;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(body);

      /* --- Sources/citations (disabled; uncomment to re-enable) ---
      if (extras.citations?.length) { ... }
      --- end sources/citations --- */

      if (extras.match_percent != null && role === "assistant") {
        const matchEl = document.createElement("div");
        matchEl.className = "match-label";
        if (extras.match_percent >= 75) matchEl.classList.add("high");
        else if (extras.match_percent >= 40) matchEl.classList.add("low");
        else matchEl.classList.add("weak");
        matchEl.textContent = `${extras.match_percent}% matched from documents`;
        div.appendChild(matchEl);
      }

      if (extras.model) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${extras.model} · ${extras.latency?.total_seconds ?? "?"}s`;
        div.appendChild(meta);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.id = "typing";
      el.innerHTML = 'Thinking<span class="typing-dots"><span></span><span></span><span></span></span>';
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() { document.getElementById("typing")?.remove(); }

    function setUploadToast(msg, type = "") {
      uploadToast.textContent = msg;
      uploadToast.className = `upload-toast ${type}`;
    }

    async function askQuestion(query) {
      const trimmed = query.trim();
      if (!trimmed) return;
      addMessage(trimmed, "user");
      input.value = "";
      submitBtn.disabled = true;
      attachBtn.disabled = true;
      showTyping();
      try {
        const res = await fetch(`${API_BASE}/query`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: trimmed }),
        });
        hideTyping();
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addMessage(err.detail || `Request failed (${res.status})`, "error");
          return;
        }
        const data = await res.json();
        addMessage(data.answer, "assistant", {
          match_percent: data.match_percent,
          model: data.model,
          latency: data.latency,
        });
      } catch (err) {
        hideTyping();
        addMessage(`Could not reach the API: ${err.message}`, "error");
      } finally {
        submitBtn.disabled = false;
        attachBtn.disabled = false;
        input.focus();
      }
    }

    async function uploadDocument(file) {
      if (!file) return;
      attachBtn.disabled = true;
      submitBtn.disabled = true;
      setUploadToast(`Uploading ${file.name}...`);
      const formData = new FormData();
      formData.append("file", file);
      try {
        const res = await fetch(`${API_BASE}/upload?folder=Uploaded-Docs&auto_ingest=true`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Upload failed (${res.status})`);
        }
        const data = await res.json();
        const chunks = data.ingestion?.total_chunks ?? 0;
        setUploadToast(`Indexed ${data.filename} (${chunks} chunks)`, "success");
        addMessage(`"${data.filename}" added to knowledge base (${chunks} chunks).`, "system");
      } catch (err) {
        setUploadToast(err.message, "error");
        addMessage(`Upload failed: ${err.message}`, "error");
      } finally {
        attachBtn.disabled = false;
        submitBtn.disabled = false;
        fileInput.value = "";
      }
    }

    attachBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (file) uploadDocument(file);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      askQuestion(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    document.querySelectorAll(".suggestion").forEach((btn) => {
      btn.addEventListener("click", () => askQuestion(btn.textContent));
    });

    checkHealth();
    input.focus();
  </script>
</body>
</html>
