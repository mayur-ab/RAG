<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Assistant</title>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #22c55e;
      --warning: #f59e0b;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.15), transparent),
                      linear-gradient(180deg, #0b0f17 0%, #0d1220 100%);
      --surface: #141b2d;
      --surface-elevated: #1a2236;
      --surface-hover: #212b42;
      --border: #2a3548;
      --text: #eef2ff;
      --text-muted: #94a3b8;
      --user-bubble: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
      --user-border: #4338ca;
      --assistant-bubble: #141b2d;
      --system-bg: #14532d33;
      --system-border: #166534;
      --system-text: #86efac;
      --input-bg: #0f1524;
      --header-bg: rgba(20, 27, 45, 0.85);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-gradient: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99, 102, 241, 0.08), transparent),
                      linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --user-bubble: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --user-border: #6366f1;
      --assistant-bubble: #ffffff;
      --system-bg: #ecfdf5;
      --system-border: #86efac;
      --system-text: #166534;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.9);
      --error-bg: #fef2f2;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
    }

    .app-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: visible;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      min-height: 0;
      transition: width var(--transition);
      overflow: visible;
    }

    .sidebar.collapsed {
      width: 56px;
    }

    .sidebar.collapsed .sidebar-brand-text,
    .sidebar.collapsed .sidebar-label,
    .sidebar.collapsed .sidebar-scroll,
    .sidebar.collapsed .label-text {
      display: none !important;
    }

    .sidebar.collapsed .sidebar-nav-btn {
      text-align: center;
      padding-inline: 0.45rem;
    }

    .sidebar.collapsed .sidebar-brand {
      justify-content: center;
    }

    .sidebar-top {
      padding: 0.85rem 0.75rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.15rem 0.35rem 0.35rem;
      font-weight: 650;
      font-size: 0.95rem;
    }

    .sidebar-icon-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1rem;
      line-height: 1;
      transition: background var(--transition), color var(--transition);
    }

    .sidebar-icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .sidebar-expand-btn[hidden] {
      display: none !important;
    }

    .sidebar-brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      display: grid;
      place-items: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
    }

    .sidebar-nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .sidebar-nav-btn:hover { background: var(--surface-hover); }
    .sidebar-nav-btn.primary {
      border-color: var(--border);
      background: var(--surface-elevated);
    }
    .sidebar-nav-btn.active {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 0.55rem 0.5rem;
    }

    .sidebar-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0.55rem 0.45rem 0.35rem;
    }

    .sidebar-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.65rem;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background var(--transition), color var(--transition);
    }

    .sidebar-item:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-item.active { background: var(--surface-hover); color: var(--text); }
    .sidebar-item.session-item { font-size: 0.74rem; cursor: pointer; }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow: visible;
      position: relative;
      z-index: 6;
    }

    .main-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      flex-shrink: 0;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .main-header-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .main-header-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
    }

    .sidebar-nav-btn .collapsed-icon {
      display: none;
    }

    .sidebar.collapsed .sidebar-nav-btn .collapsed-icon {
      display: inline;
    }

    .sidebar.collapsed .sidebar-brand-icon {
      display: none;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

    .status {
      font-size: 0.72rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
      white-space: nowrap;
    }

    .status.ok { color: var(--success); border-color: #16653455; }

    .mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.28rem 0.55rem 0.28rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.72rem;
      color: var(--text-muted);
      user-select: none;
      white-space: nowrap;
    }

    .mode-toggle-label {
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .mode-toggle-label.active {
      color: var(--accent);
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .switch-slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform var(--transition), background var(--transition);
    }

    .switch input:checked + .switch-slider {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent);
    }

    .switch input:checked + .switch-slider::before {
      transform: translate(18px, -50%);
      background: var(--accent);
    }

    .switch input:focus-visible + .switch-slider {
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .meta-mode {
      margin-top: 0.35rem;
      font-size: 0.68rem;
      color: var(--accent);
      font-weight: 600;
    }

    main {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #chat::-webkit-scrollbar {
      width: 10px;
    }

    #chat::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    #chat::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
      background-clip: padding-box;
    }

    .chat-inner {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: min(100%, 280px);
    }

    .composer {
      flex-shrink: 0;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      max-width: 85%;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: center;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      max-width: 95%;
    }

    [data-theme="dark"] .message.error {
      background: #3f1d1d;
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .message.system {
      align-self: center;
      background: var(--system-bg);
      border: 1px solid var(--system-border);
      color: var(--system-text);
      font-size: 0.84rem;
      max-width: 95%;
    }

    .match-label {
      margin-top: 0.6rem;
      font-size: 0.76rem;
      color: var(--success);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
    }

    .match-label.low { color: var(--warning); background: rgba(245, 158, 11, 0.1); }
    .match-label.weak { color: var(--text-muted); background: var(--surface-hover); }

    .meta {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .welcome {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 1rem 1.5rem;
    }

    .welcome h2 {
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .welcome p { font-size: 0.9rem; max-width: 420px; margin: 0 auto; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all var(--transition);
    }

    .suggestion:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      padding: 0.45rem;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      box-shadow: var(--shadow);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow);
    }

    .attach-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--surface-hover);
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: all var(--transition);
      display: grid;
      place-items: center;
    }

    .attach-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      transform: scale(1.04);
    }

    .attach-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #file-input { display: none; }

    textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      padding: 0.65rem 0.25rem;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.93rem;
      outline: none;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
    }

    .send-btn[hidden] {
      display: none !important;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.04);
    }

    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .typing {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding: 0.35rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .typing-dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .upload-toast {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1rem;
    }

    .upload-toast.success { color: var(--success); }
    .upload-toast.error { color: var(--error-text); }

    .input-meta {
      display: flex;
      justify-content: flex-end;
      padding: 0.15rem 0.35rem 0;
      min-height: 1.1rem;
    }

    .query-limit-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .query-limit-hint.warn { color: var(--warning); }
    .query-limit-hint.over { color: var(--error-text); }

    .citations { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
    .citations summary { cursor: pointer; color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .toolbar-btn, .model-select {
      font-size: 0.72rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .toolbar-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
    .model-select { max-width: 160px; }

    .export-wrap { position: relative; }
    .export-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      min-width: 140px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      z-index: 40;
      overflow: hidden;
    }

    .sidebar.collapsed .export-menu {
      left: calc(100% + 8px);
      right: auto;
      bottom: 0;
      min-width: 150px;
    }

    .export-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.75rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .export-menu button:hover { background: var(--surface-hover); }

    .badge {
      margin-top: 0.45rem;
      display: inline-flex;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
    }

    .badge-success { color: var(--success); background: rgba(34, 197, 94, 0.12); }
    .badge-warning { color: var(--warning); background: rgba(245, 158, 11, 0.12); }
    .badge-cache { color: var(--accent); background: rgba(99, 102, 241, 0.12); }

    .message-actions { margin-top: 0.35rem; display: flex; gap: 0.35rem; }
    .message-edit-input {
      width: 100%;
      min-height: 2.5rem;
      margin-top: 0.15rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.2);
      color: inherit;
      font: inherit;
      line-height: 1.45;
      resize: vertical;
    }
    .message-edit-actions {
      margin-top: 0.45rem;
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
    }
    .message-edit-actions .edit-save {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .msg-action-btn {
      font-size: 0.68rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.15);
      color: #fff;
      cursor: pointer;
    }

    .table-wrap { overflow-x: auto; margin-top: 0.35rem; }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .table-wrap th, .table-wrap td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.55rem;
      text-align: left;
    }

    .table-wrap th { background: var(--surface-hover); }

    .stop-btn {
      background: #ef4444 !important;
    }

    .drop-zone {
      border: 1px dashed transparent;
      border-radius: calc(var(--radius) + 4px);
      transition: border-color var(--transition), background var(--transition);
    }

    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
    }

    .panel, .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .modal.modal-top {
      z-index: 100;
    }

    .profile-summary {
      font-size: 0.84rem;
      line-height: 1.5;
      color: var(--text);
    }

    .panel[hidden], .modal[hidden] {
      display: none !important;
    }

    .export-menu[hidden] {
      display: none !important;
    }

    .panel-card, .modal-card {
      width: min(920px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .panel-header, .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .doc-row {
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }

    .doc-title { font-weight: 600; font-size: 0.88rem; }
    .doc-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }
    .doc-path { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; word-break: break-all; }

    .docs-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 1rem;
      min-height: 360px;
    }
    @media (max-width: 720px) {
      .docs-layout { grid-template-columns: 1fr; }
    }
    .docs-browse {
      border-right: 1px solid var(--border);
      padding-right: 0.75rem;
      max-height: 60vh;
      overflow: auto;
    }
    .docs-main {
      max-height: 60vh;
      overflow: auto;
    }
    .docs-search {
      width: 100%;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 0.82rem;
      margin-bottom: 0.6rem;
    }
    .docs-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0.75rem 0 0.35rem;
    }
    .docs-cat-btn, .docs-sub-btn, .docs-tag-btn {
      display: flex;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
    }
    .docs-cat-btn:hover, .docs-sub-btn:hover, .docs-tag-btn:hover {
      background: var(--surface-hover);
    }
    .docs-cat-btn.active, .docs-sub-btn.active, .docs-tag-btn.active {
      background: var(--surface-hover);
      font-weight: 600;
    }
    .docs-sub-btn { padding-left: 1rem; font-size: 0.76rem; }
    .docs-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .docs-actions .toolbar-btn { font-size: 0.72rem; padding: 0.3rem 0.55rem; }
    .doc-tags { margin-top: 0.25rem; }
    .doc-tag {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      margin-right: 0.25rem;
      color: var(--text-muted);
    }
    .doc-summary {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.4;
    }
    .docs-empty, .docs-loading {
      color: var(--text-muted);
      font-size: 0.82rem;
      padding: 1rem 0;
    }

    .profile-section { margin-bottom: 1rem; }
    .profile-section h4 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .profile-chip, .profile-tag {
      display: inline-block;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      margin: 0.15rem 0.25rem 0.15rem 0;
    }
    .profile-value { font-size: 0.88rem; line-height: 1.45; }
    .profile-list { list-style: none; padding: 0; }
    .profile-list li {
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .profile-list li:last-child { border-bottom: none; }
    .profile-meta { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.2rem; }
    .profile-empty { color: var(--text-muted); font-size: 0.82rem; }
    .profile-name { font-size: 1.1rem; font-weight: 650; margin-bottom: 0.25rem; }
    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .danger-btn {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }
    [data-theme="light"] .danger-btn {
      color: #b91c1c;
      background: #fef2f2;
    }
    .danger-btn:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: #ef4444;
    }
    .confirm-card { width: min(480px, 100%); }
    .confirm-message {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin: 0.75rem 0 1rem;
      white-space: pre-line;
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .progress-track {
      height: 8px;
      background: var(--surface-hover);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.75rem 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      transition: width 0.25s ease;
    }

    .streaming-body::after {
      content: "▍";
      animation: blink 1s step-end infinite;
      color: var(--accent);
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 768px) {
      .sidebar:not(.collapsed) { width: 220px; }
      .sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
      .main-header { padding: 0.55rem 0.75rem; flex-wrap: wrap; }
      .main-header-actions { flex-wrap: wrap; justify-content: flex-end; }
      .mode-toggle { order: 3; width: 100%; justify-content: center; }
      .model-select { max-width: 120px; }
      .chat-inner, .composer { padding-left: 0.75rem; padding-right: 0.75rem; }
      .message { max-width: 92%; font-size: 0.88rem; }
      .status { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <button type="button" class="sidebar-icon-btn" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">‹</button>
          <div class="sidebar-brand-icon">RAG</div>
          <span class="sidebar-brand-text">Assistant</span>
        </div>
        <button type="button" class="sidebar-nav-btn primary" id="new-chat-btn" title="New chat">
          <span class="label-text">+ New chat</span>
          <span class="collapsed-icon" aria-hidden="true">+</span>
        </button>
      </div>
      <div class="sidebar-scroll">
        <div class="sidebar-label">Recents</div>
        <div id="sidebar-recents"></div>
        <div class="sidebar-label">Past sessions</div>
        <div id="sidebar-sessions"></div>
      </div>
      <div class="sidebar-footer">
        <button type="button" class="sidebar-nav-btn" id="end-session-sidebar-btn" title="End session">
          <span class="label-text">End session</span>
          <span class="collapsed-icon" aria-hidden="true">⏻</span>
        </button>
        <button type="button" class="sidebar-nav-btn" id="profile-btn" title="Profile">
          <span class="label-text">Profile</span>
          <span class="collapsed-icon" aria-hidden="true">👤</span>
        </button>
        <button type="button" class="sidebar-nav-btn" id="docs-btn" title="Documents">
          <span class="label-text">Documents</span>
          <span class="collapsed-icon" aria-hidden="true">📄</span>
        </button>
        <div class="export-wrap">
          <button type="button" class="sidebar-nav-btn" id="export-btn" title="Export chat">
            <span class="label-text">Export</span>
            <span class="collapsed-icon" aria-hidden="true">⇪</span>
          </button>
          <div class="export-menu" id="export-menu" hidden>
            <button type="button" id="export-md">Markdown</button>
            <button type="button" id="export-pdf">PDF</button>
            <button type="button" id="export-copy">Copy all</button>
          </div>
        </div>
        <button type="button" class="sidebar-nav-btn" id="reindex-btn" title="Re-index all">
          <span class="label-text">Re-index all</span>
          <span class="collapsed-icon" aria-hidden="true">⟳</span>
        </button>
      </div>
    </aside>

    <div class="main-pane">
      <div class="main-header">
        <div class="main-header-left">
          <button type="button" class="icon-btn sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar" aria-label="Expand sidebar" hidden>☰</button>
          <div class="main-header-title" id="chat-title">New chat</div>
        </div>
        <div class="main-header-actions">
          <div class="mode-toggle" title="Toggle between document search (RAG) and direct model chat">
            <span class="mode-toggle-label active" id="rag-label">RAG</span>
            <label class="switch" aria-label="Toggle RAG mode">
              <input type="checkbox" id="rag-toggle" checked />
              <span class="switch-slider"></span>
            </label>
            <span class="mode-toggle-label" id="direct-label">Direct</span>
          </div>
          <select id="model-select" class="model-select" title="LLM model"></select>
          <button type="button" class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <span id="theme-icon">☀️</span>
          </button>
          <div class="status" id="status">Connecting...</div>
        </div>
      </div>

      <main>
    <div id="chat">
      <div class="chat-inner" id="chat-inner">
        <div class="welcome" id="welcome">
          <h2>What would you like to know?</h2>
          <p>Upload documents with the + button or ask questions about your indexed knowledge base.</p>
          <div class="suggestions">
            <button class="suggestion" type="button">What is the Duolingo Strategy?</button>
            <button class="suggestion" type="button">Tell me about the Comic Strip Style Memes</button>
            <button class="suggestion" type="button">Explain The Role of Namagiri Devi</button>
          </div>
        </div>
      </div>
    </div>

    <template id="welcome-template">
      <div class="welcome" id="welcome">
        <h2>What would you like to know?</h2>
        <p>Upload documents with the + button or ask questions about your indexed knowledge base.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">What is the Duolingo Strategy?</button>
          <button class="suggestion" type="button">Tell me about the Comic Strip Style Memes</button>
          <button class="suggestion" type="button">Explain The Role of Namagiri Devi</button>
        </div>
      </div>
    </template>

    <div class="composer">
      <div class="upload-toast" id="upload-toast"></div>

      <form id="query-form">
        <div class="drop-zone" id="drop-zone">
          <div class="input-bar">
            <input type="file" id="file-input" multiple
              accept=".txt,.md,.pdf,.doc,.docx,.html,.htm,.csv,.xlsx,.xls" />
            <button type="button" class="attach-btn" id="attach-btn" title="Upload documents" aria-label="Upload documents">+</button>
            <textarea id="query-input" placeholder="Ask a question..." rows="1" required></textarea>
            <button type="submit" class="send-btn" id="submit-btn" title="Send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/>
              </svg>
            </button>
            <button type="button" class="send-btn stop-btn" id="stop-btn" title="Stop" aria-label="Stop" hidden>■</button>
          </div>
          <div class="input-meta">
            <span id="query-limit-hint" class="query-limit-hint" aria-live="polite"></span>
          </div>
        </div>
      </form>
    </div>
  </main>
    </div>
  </div>

  <div class="panel" id="docs-panel" hidden>
    <div class="panel-card docs-panel-card">
      <div class="panel-header">
        <h3>Knowledge library</h3>
        <button type="button" class="toolbar-btn" id="docs-close">Close</button>
      </div>
      <div class="docs-actions">
        <button type="button" class="toolbar-btn" id="docs-classify-btn">Classify all</button>
        <button type="button" class="toolbar-btn" id="docs-cluster-btn">Run clustering</button>
        <button type="button" class="toolbar-btn" id="docs-clear-filter-btn">Clear filters</button>
      </div>
      <div class="docs-layout">
        <aside class="docs-browse" id="docs-browse"></aside>
        <div class="docs-main" id="docs-list"></div>
      </div>
    </div>
  </div>

  <div class="modal modal-top" id="confirm-modal" hidden>
    <div class="modal-card confirm-card">
      <div class="modal-header">
        <h3 id="confirm-title">Confirm</h3>
      </div>
      <p class="confirm-message" id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="toolbar-btn" id="confirm-cancel">Cancel</button>
        <button type="button" class="toolbar-btn danger-btn" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <div class="modal" id="profile-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3>Your profile</h3>
        <button type="button" class="toolbar-btn" id="profile-close">Close</button>
      </div>
      <div id="profile-content">
        <p class="profile-empty">Loading profile...</p>
      </div>
    </div>
  </div>

  <div class="modal" id="ingest-modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3>Bulk ingest progress</h3>
        <button type="button" class="toolbar-btn" id="ingest-close">Close</button>
      </div>
      <div class="progress-track"><div class="progress-bar" id="ingest-bar"></div></div>
      <div id="ingest-status">Preparing...</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
